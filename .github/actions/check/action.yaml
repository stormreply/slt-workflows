name: Check code

inputs:
  exit_on_fail:
    required: false
  personal_access_token:
    required: false
  terraform_app_id:
    required: false
  terraform_private_key:
    required: false

runs:
  using: composite
  steps:

    - name: set token
      if: inputs.personal_access_token != '' || inputs.terraform_private_key != ''
      id: set-token
      uses: stormreply/slt-workflows/.github/actions/set-token@main
      with:
        personal_access_token: ${{ inputs.personal_access_token }}
        terraform_app_id: ${{ inputs.terraform_app_id }}
        terraform_private_key: ${{ inputs.terraform_private_key }}

    - name: checkout code
      uses: stormreply/slt-workflows/.github/actions/terraform/checkout@main

    - name: checkout support
      uses: actions/checkout@v6
      with:
        # checkout under /home/runner/work/slt-member-example/slt-member-example/slt-repo-template
        repository: stormreply/slt-repo-template
        path: slt-repo-template

    - name: check-conformity
      id: check-conformity
      shell: bash
      run: |
        # check-conformity
        ./slt-repo-template/.support/check-conformity.sh
        echo "exit_on_fail: ${{inputs.exit_on_fail}}"
        if [ $? -ne 0 ] ; then
          if [ "${{ inputs.exit_on_fail }}" = "true" ] ; then
            echo "::error title=Not compliant::This repository is not SLT compliant (anymore)."
          else
            echo "::warning title=Not compliant::This repository is not SLT compliant (anymore)."
          fi
        fi

name: Check compliance

inputs:
  exit_on_fail:
    required: false
  publish_badge:
    required: false
  personal_access_token:
    required: false
  terraform_app_id:
    required: false
  terraform_private_key:
    required: false

runs:
  using: composite
  steps:

    - name: set token
      if: inputs.personal_access_token != '' || inputs.terraform_private_key != ''
      id: set-token
      uses: stormreply/slt-workflows/.github/actions/set-token@main
      with:
        personal_access_token: ${{ inputs.personal_access_token }}
        terraform_app_id: ${{ inputs.terraform_app_id }}
        terraform_private_key: ${{ inputs.terraform_private_key }}

    - name: checkout code
      uses: stormreply/slt-workflows/.github/actions/terraform/checkout@main

    - name: checkout support
      uses: actions/checkout@v6
      with:
        repository: stormreply/slt-repo-template
        path: slt-repo-template

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install --quiet boto3

    - name: Run Bedrock compliance check
      env:
        AWS_REGION: eu-central-1   # TODO: pass from workflow
        BEDROCK_MODEL_ID: eu.anthropic.claude-sonnet-4-6 # anthropic.claude-opus-4-7
        COMPLIANCE_FILE: ./slt-repo-template/.support/compliance.md
      shell: bash
      run: python ./slt-repo-template/.support/check-compliance.py   # .support/check_compliance.py

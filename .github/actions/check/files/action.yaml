name: Check files

inputs:
  exit_on_fail:
    required: false
  publish_badge:
    required: false
  personal_access_token:
    required: false
  terraform_app_id:
    required: false
  terraform_private_key:
    required: false

runs:
  using: composite
  steps:

    - name: set token
      if: inputs.personal_access_token != '' || inputs.terraform_private_key != ''
      id: set-token
      uses: stormreply/slt-workflows/.github/actions/set-token@main
      with:
        personal_access_token: ${{ inputs.personal_access_token }}
        terraform_app_id: ${{ inputs.terraform_app_id }}
        terraform_private_key: ${{ inputs.terraform_private_key }}

    - name: checkout code
      uses: stormreply/slt-workflows/.github/actions/terraform/checkout@main

    - name: checkout support
      uses: actions/checkout@v6
      with:
        repository: stormreply/slt-repo-template
        path: slt-repo-template

    - name: check files
      id: check-files
      shell: bash
      run: |
        # check/files
        rc=0
        ./slt-repo-template/.support/check-files.sh || rc=$?
        echo "exit_on_fail: ${{inputs.exit_on_fail}}"
        if [ $rc -ne 0 ] ; then
          if [ "${{ inputs.exit_on_fail }}" = "true" ] ; then
            echo "::error title=Not compliant::This repository is not SLT compliant. Maybe it was before."
            exit 1
          else
            echo "::warning title=Not compliant::This repository is not SLT compliant. Maybe it was before."
          fi
        fi
      continue-on-error: true

    - name: publish badge
      if: inputs.publish_badge == 'true'
      uses: stormreply/slt-workflows/.github/actions/badges@main
      with:
        label: "Check Compliance"
        message: ${{ steps.check-files.outcome == 'success' && 'passed' || 'failed' }}
        score: ${{ steps.check-files.outcome == 'success' && '0' || '1' }}

    - name: check failure
      if: steps.check-files.outcome == 'failure'
      run: exit 1

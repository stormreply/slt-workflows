name: Check code

inputs:
  personal_access_token:
    required: false
  terraform_app_id:
    required: false
  terraform_private_key:
    required: false

runs:
  using: composite
  steps:

    - name: set token
      if: inputs.personal_access_token != '' || inputs.terraform_private_key != ''
      id: set-token
      uses: stormreply/slt-workflows/.github/actions/set-token@main
      with:
        personal_access_token: ${{ inputs.personal_access_token }}
        terraform_app_id: ${{ inputs.terraform_app_id }}
        terraform_private_key: ${{ inputs.terraform_private_key }}

    - name: checkout code
      uses: stormreply/slt-workflows/.github/actions/terraform/checkout@main

    - name: check code
      id: check-code
      shell: bash
      run: |
        # check/code (pre-commit-terraform)
        docker run \
          --entrypoint /bin/bash \
          -e "USERID=$(id -u):$(id -g)" \
          -e "TOKEN=${{ env.TOKEN }}" \
          -v $(pwd):/lint \
          -w /lint \
          ghcr.io/antonbabenko/pre-commit-terraform:latest -c '
            git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
            # git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "git@github.com:"
            # git config --list --show-origin
            terraform --version
            pre-commit run -a
          '

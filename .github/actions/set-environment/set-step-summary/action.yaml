name: Set GITHUB_STEP_SUMMARY

runs:
  using: composite
  steps:

    - name: set-step-summary
      shell: bash
      run: |
        # set-environment/set-step-summary

        date >> $GITHUB_STEP_SUMMARY

        STATUS="OK"
        [ -z "$BACKEND_ACCOUNT"    ] && echo "::error ::Github repository variable BACKEND_ACCOUNT not set" && STATUS="ERROR"
        [ -z "$BACKEND_REGION"     ] && echo "::error ::Github repository variable BACKEND_REGION not set" && STATUS="ERROR"
        [ -z "$DEPLOYMENT_ACCOUNT" ] && echo "::error ::Github repository variable DEPLOYMENT_ACCOUNT not set" && STATUS="ERROR"
        [ -z "$DEPLOYMENT_REGION"  ] && echo "::error ::Github repository variable DEPLOYMENT_REGION not set" && STATUS="ERROR"
        echo "STATUS: [$STATUS]"
        cat << EOF >> $GITHUB_STEP_SUMMARY

        | Parameters                    |                     |   |
        |:------------------------------|---------------------|---|
        | access domain                 | $ACCESS_DOMAIN      | P |
        | access role                   | $ACCESS_ROLE        | P |
        | backend account               | $BACKEND_ACCOUNT    | P |
        | backend bucket                | $BACKEND_BUCKET     | C |
        | backend region                | $BACKEND_REGION     | P |
        | deployment account            | $DEPLOYMENT_ACCOUNT | P |
        | deployment name               | $DEPLOYMENT_NAME    | C |
        | deployment region             | $DEPLOYMENT_REGION  | P |
        | environment                   | $ENVIRONMENT        | P |
        | oidc principal                | $OIDC_PRINCIPAL     | P |
        | short name                    | $SHORT_NAME         | C |
        | state file                    | $STATE_FILE         | C |
        | terraform app id              | $TERRAFORM_APP_ID   | V |
        | token shasum                  | $TOKEN_SHASUM       | C |
        | token type                    | $TOKEN_TYPE         | C |

        EOF

        [ "$STATUS" = "OK" ] && exit 0 || exit 1

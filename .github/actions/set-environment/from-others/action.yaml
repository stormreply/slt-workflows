name: Set environment from others

# TODO: resolve from-others; lift everything one level up

runs:
  using: composite
  steps:

    - name: set backend bucket
      if: env.BACKEND_ACCOUNT != ''
      id: set-backend-bucket
      uses: stormreply/slt-workflows/.github/actions/set-environment/from-others/set-backend-bucket@main

    - name: set deployment name
      id: set-deployment-name
      uses: stormreply/slt-workflows/.github/actions/set-environment/from-others/set-deployment-name@main

    - name: set state file
      id: set-state-file
      uses: stormreply/slt-workflows/.github/actions/set-environment/from-others/set-state-file@main

    # TODO: write own set-terraform-roles action
    - name: set env from others
      id: set-environment-from-others
      shell: bash
      run: |
        # set-environment/from-others

        [ -z "$DEPLOYMENT_ACCOUNT" ] && DEPLOYMENT_ACCOUNT=${{ env.BACKEND_ACCOUNT }}
        [ -z "$DEPLOYMENT_REGION"  ] && DEPLOYMENT_REGION=${{ env.BACKEND_REGION }}

        [ -z "${{ env.ACTOR }}" ] && actor=${{ github.actor }} || actor=${{ env.ACTOR }}

        cat << EOF >> $GITHUB_ENV
        ACTOR=${actor}
        BACKEND_ROLE=slt-0-storm-library-for-terraform-${actor}-backend
        DEPLOYMENT_ACCOUNT=$DEPLOYMENT_ACCOUNT
        DEPLOYMENT_REGION=$DEPLOYMENT_REGION
        DEPLOYMENT_ROLE=slt-0-storm-library-for-terraform-${actor}-deployment
        EOF

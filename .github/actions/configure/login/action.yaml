name: AWS Login

inputs:
  region:
    required: true
    description: "AWS Region"
  role-to-assume:
    required: false
    description: "AWS Role ARN to assume (for OIDC)"
  aws-access-key-id:
    required: false
    description: "AWS Access Key ID (if not using OIDC)"
  aws-secret-access-key:
    required: false
    description: "AWS Secret Access Key (if not using OIDC)"
  aws-session-token:
    required: false
    description: "AWS Session Token (if using temporary credentials)"

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.region }}
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-session-token: ${{ inputs.aws-session-token }}

    - name: Verify AWS Identity
      shell: bash
      run: |
        echo "Verifying AWS credentials..."
        aws sts get-caller-identity

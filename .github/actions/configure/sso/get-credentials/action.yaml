name: Get credentials

inputs:
  access_token:
    required: true
  account_id:
    required: true
  permission_set:
    required: true
  region:
    required: true

outputs:
  AWS_ACCESS_KEY_ID:
    value:  ${{ steps.get-credentials.outputs.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:
    value:  ${{ steps.get-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN:
    value:  ${{ steps.get-credentials.outputs.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION:
    value:  ${{ steps.get-credentials.outputs.AWS_DEFAULT_REGION }}

runs:
  using: composite
  steps:
    - name: get credentials
      id: get-credentials
      shell: bash
      run: |
        # configure/sso/get-credentials

        echo "get credentials for permission set ${{ inputs.permission_set}} in account ${{ inputs.account_id}}"

        CREDENTIALS=$(
          aws sso get-role-credentials \
            --account-id ${{ inputs.account_id }} \
            --region ${{ inputs.region }} \
            --role-name ${{ inputs.permission_set }} \
            --access-token '${{ inputs.access_token }}'
        )

        export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | yq '.roleCredentials.accessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | yq '.roleCredentials.secretAccessKey')
        export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | yq '.roleCredentials.sessionToken')

        echo "::add-mask::$AWS_ACCESS_KEY_ID"
        echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
        echo "::add-mask::$AWS_SESSION_TOKEN"

        cat << EOF >> $GITHUB_ENV
        AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
        AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN
        AWS_DEFAULT_REGION=${{ inputs.region }}
        EOF

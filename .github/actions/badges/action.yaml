name: Publish badge

inputs:
  file:
    required: true
  label:
    required: true
  message:
    required: true
  score:
    required: true
  color_list:
    required: false

runs:
  using: composite
  steps:

    - name: checkout repository
      uses: actions/checkout@v6

    - name: checkout badges branch
      shell: bash
      run: |
        # checkout badges branch
        if git ls-remote --exit-code --heads origin badges ; then
          git fetch origin badges
          git checkout badges
        else
          git checkout --orphan badges
          git rm -rf .
        fi

    - name: write badge
      shell: bash
      run: |
        # write badge

        score_to_color() {

          local value="${1}"
          local colors="${2:-green,red}"

          # Wenn value keine nicht-negative Zahl ist: als String zurückgeben.
          if ! [[ "$value" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            printf '%s' "$value"
            return 0
          fi

          # Zahl muss in [0, 1] liegen.
          if ! awk -v v="$value" 'BEGIN { exit !(v >= 0 && v <= 1) }'; then
            printf 'score_to_color: value out of range [0,1]: %s\n' "$value" >&2
            return 1
          fi

          # Farben aus Komma-Liste aufteilen + Whitespace stripten.
          local -a color_arr
          IFS=',' read -r -a color_arr <<< "$colors"
          local i
          for i in "${!color_arr[@]}"; do
            color_arr[$i]="${color_arr[$i]// /}"
          done

          local n="${#color_arr[@]}"
          if (( n == 0 )); then
            printf 'score_to_color: empty color list\n' >&2
            return 1
          fi

          # Index berechnen.
          local idx
          if awk -v v="$value" 'BEGIN { exit !(v == 0) }'; then
            idx=0
          elif (( n == 1 )); then
            idx=0
          else
            # Buckets = n - 1, Index = ceil(v * Buckets).
            # ceil ist hier so definiert, dass die Grenze v = k/Buckets
            # noch zum Bucket k gehört (linke Grenze offen, rechte geschlossen).
            idx=$(
              awk -v v="$value" -v n="$n" '
                BEGIN {
                  buckets = n - 1
                  x = v * buckets
                  ceil = (x == int(x)) ? x : int(x) + 1
                  print ceil
                }
              '
            )
          fi

          printf '%s' "${color_arr[$idx]}"
        }

        score_to_color "${{ inputs.score }}" "${{ inputs.color_list }}"
        color=$(score_to_color "${{ inputs.score }}" "${{ inputs.color_list }}")
        echo "color: $color"

        cat << EOF | tee > "${{ inputs.file }}"
        {
          "schemaVersion": 1,
          "label": "${{ inputs.label }}",
          "message": "${{ inputs.message }}",
          "color": "${color}"
        }
        EOF

    - name: commit and push
      shell: bash
      run: |
        # commit badge
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${{ inputs.file }}"
        git diff
        git diff --cached --quiet || git commit -m "update badge: ${{ inputs.file }} [skip ci]"
        git push origin badges

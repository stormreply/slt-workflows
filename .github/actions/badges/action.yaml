name: Publish badge

inputs:
  label:
    required: true
  message:
    required: true
  color:
    required: true

runs:
  using: composite
  steps:

    - name: checkout repository
      uses: actions/checkout@v6

    - name: checkout badges branch
      shell: bash
      run: |
        # checkout badges branch
        if git ls-remote --exit-code --heads origin badges ; then
          git fetch origin badges
          git checkout badges
        else
          git checkout --orphan badges
          git rm -rf .
        fi

    - name: write badge
      shell: bash
      run: |
        # write badge
        cat > "${{ inputs.label }}.json" <<'EOF'
        {
          "schemaVersion": 1,
          "label": "${{ inputs.label }}",
          "message": "${{ inputs.message }}",
          "color": "${{ inputs.color }}"
        }
        EOF

    - name: commit and push
      shell: bash
      run: |
        # commit badge
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${{ inputs.label }}.json"
        git diff --cached --quiet || git commit -m "update badge: ${{ inputs.label }} [skip ci]"
        git push origin badges

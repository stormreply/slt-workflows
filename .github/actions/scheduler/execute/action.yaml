name: Execute

runs:
  using: composite
  steps:

    - name: Execute
      shell: bash
      run: |
        # scheduler/execute

        for job in $(cat /tmp/selected) ; do

          file=${job##*/} ; f=${file}
          date=${f%%.*} ; f=${f##$date.}
          time=${f%%.*} ; f=${f##$time.}
          action=${f%%.*} ; f=${f##$action.}
          account_id=${f%%.*} ; f=${f##$account_id.}
          region=${f%%.*} ; f=${f##$region.}
          owner=${f%%.*} ; f=${f##$owner.}
          repo=${f%%.*} ; environment=${f##$repo.}

          printf "%-8s %-6s %-7s %-12s %-15s %-15s %-30s %-s\n" \
            "DATE" "TIME" "ACTION" "ACCOUNT_ID" "REGION" "OWNER" "REPO" "ENVIRONMENT"
          printf "%-8s %-6s %-7s %-12s %-15s %-15s %-30s %-s\n" \
            "$date" "$time" "$action" "$account_id" "$region" "$owner" "$repo" "$environment"

          aws s3 cp \
            s3://${{ env.BACKEND_BUCKET }}/schedule/$file \
            /tmp \
            --quiet

          cat << EOF
          EXECUTE
            cat /tmp/$file
            | gh workflow run ${action}.yaml --repo ${owner}/${repo} --json
        EOF

          cat /tmp/$file \
          | gh workflow run ${action}.yaml \
            --repo ${owner}/${repo} \
            --json \
            &

        done

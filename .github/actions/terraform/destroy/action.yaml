name: Terraform destroy

runs:
  using: composite
  steps:

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform init with S3 backend
      shell: bash
      run: |
        # terraform init
        terraform init \
          -backend-config="bucket=${{ env.BACKEND_BUCKET }}" \
          -backend-config="profile=backend" \
          -backend-config="key=${{ env.STATE_KEY }}" \
          -backend-config="region=${{ env.BACKEND_REGION }}" \
          -backend-config="use_lockfile=true"

    - name: Terraform destroy
      shell: bash
      run: |
        # terraform/destroy
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN
        unset AWS_ACCESS_KEY_ID

        export AWS_PROFILE=deployment
        echo  "AWS_PROFILE=deployment" >> $GITHUB_ENV

        for tfvars in *.tfvars ; do
          var_files="$var_files -var-file=$tfvars"
        done

        terraform version
        terraform destroy \
          -auto-approve \
          -input=false \
          $var_files

name: Set backend profile in AWS config

inputs:
  use_oidc:
    required: false
    default: "true"

runs:
  using: composite
  steps:

    - name: assume terraform backend role
      if: inputs.use_oidc == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.BACKEND_REGION }}
        role-session-name: TerraformBackendSession
        role-to-assume: arn:aws:iam::${{ env.BACKEND_ACCOUNT }}:role/${{ env.BACKEND_ROLE }}

    - name: set backend profile
      shell: bash
      run: |
        # terraform/checkout/set-backend-profile
        aws configure set profile.backend.region ${{ env.BACKEND_REGION }}
        aws configure set profile.backend.aws_access_key_id $AWS_ACCESS_KEY_ID
        aws configure set profile.backend.aws_secret_access_key $AWS_SECRET_ACCESS_KEY
        [ -n "$AWS_SESSION_TOKEN" ] && aws configure set profile.backend.aws_session_token $AWS_SESSION_TOKEN

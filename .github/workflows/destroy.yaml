name: Destroy

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      delay:
        type: string
        required: false
        default: ""
    secrets:
      INFRACOST_API_KEY:
        required: false
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

jobs:

  schedule:
    if: inputs.delay != ''
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          action: destroy
          github_vars: "${{ toJson(vars) }}"

      - name: set backend profile in AWS config
        uses: stormreply/slt-workflows/.github/actions/terraform/checkout/set-backend-profile@main

      - name: schedule destroy
        uses: stormreply/slt-workflows/.github/actions/schedule@main
        with:
          action: destroy
          delay: ${{ inputs.delay }}

  destroy:
    if: inputs.delay == ''
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          action: destroy
          github_vars: "${{ toJson(vars) }}"

      - name: destroy
        uses: stormreply/slt-workflows/.github/actions/destroy@main
        with:
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}
          token_notice: true

      - name: unschedule actions
        uses: stormreply/slt-workflows/.github/actions/unschedule@main
        with:
          action: ".*"
        # continue-on-error: true

      - name: unlock terraform
        id: unlock-terraform
        if: always()
        uses: stormreply/slt-workflows/.github/actions/unlock@main

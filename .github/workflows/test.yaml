name: Test

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      var_file:
        type: string
        required: false
        default: ""
    secrets:
      INFRACOST_API_KEY:
        required: false
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

jobs:

  check:
    runs-on: ubuntu-latest
    steps:

      - name: Time
        shell: bash
        run: date

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"
          action: test

      - name: scan
        uses: stormreply/slt-workflows/.github/actions/scan@main

  plan:
    runs-on: ubuntu-latest
    outputs:
      env_json: ${{ steps.set-environment.outputs.env_json }}
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"

      - name: plan
        uses: stormreply/slt-workflows/.github/actions/plan@main
        with:
          var_file: ${{ inputs.var_file }}
          infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.plan.outputs.env_json) }}
    steps:

      - name: apply
        uses: stormreply/slt-workflows/.github/actions/apply@main

  destroy:
    needs: [plan, apply]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.plan.outputs.env_json) }}
    steps:

      - name: destroy
        uses: stormreply/slt-workflows/.github/actions/destroy@main

      - name: unschedule actions
        uses: stormreply/slt-workflows/.github/actions/unschedule@main
        with:
          action: ".*"
        continue-on-error: true

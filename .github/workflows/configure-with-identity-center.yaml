name: Configure with Identity Center

on:
  workflow_call:
    # checkov:skip=CKV_GHA_7: "GitHub Actions workflow_dispatch inputs MUST be empty"
    inputs:
      access_domain:
        type: string
      permission_set:
        type: string
      account_id:
        type: string
      region:
        type: string
    secrets:
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

permissions:
  actions: write
  contents: read

jobs:

  sso:
    runs-on: ubuntu-latest
    outputs:
      AWS_ACCESS_KEY_ID:     ${{ steps.get-credentials.outputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ steps.get-credentials.outputs.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ steps.get-credentials.outputs.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION:    ${{ steps.get-credentials.outputs.AWS_DEFAULT_REGION }}
    steps:

      - name: get access token
        uses: stormreply/slt-workflows/.github/actions/configure/sso/get-access-token@main
        with:
          access_domain: ${{ inputs.access_domain }}
          region: ${{ inputs.region }}

      - name: get credentials
        id: get-credentials
        uses: stormreply/slt-workflows/.github/actions/configure/sso/get-credentials@main
        with:
          access_token: ${{ env.ACCESS_TOKEN }}
          account_id: ${{ inputs.account_id }}
          permission_set: ${{ inputs.permission_set }}
          region: ${{ inputs.region }}

  build:
    needs: sso
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.sso.outputs.env_json) }}
    steps:

      - name: Verify AWS Identity
        shell: bash
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity


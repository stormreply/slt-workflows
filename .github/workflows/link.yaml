name: Set backend

permissions:
  read-all

on:
  workflow_call:
    inputs:
      backend_account:
        type: string
        required: true
      backend_region:
        type: string
        required: true
    secrets:
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

jobs:

  link:
    runs-on: ubuntu-latest
    steps:

      - name: set token
        id: set-token
        uses: stormreply/slt-workflows/.github/actions/set-token@main
        with:
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"
          yaml: |
            BACKEND_ACCOUNT: ${{ inputs.backend_account }}
            BACKEND_REGION: ${{ inputs.backend_region }}
          show: set-backend

      - name: save backend account
        id: save-backend-account
        uses: stormreply/slt-workflows/.github/actions/configure/init/save-variable@main
        with:
          repository: ${{ github.repository }}
          value: ${{ env.BACKEND_ACCOUNT }}
          variable: BACKEND_ACCOUNT

      - name: save backend region
        id: save-backend-region
        uses: stormreply/slt-workflows/.github/actions/configure/init/save-variable@main
        with:
          repository: ${{ github.repository }}
          value: ${{ env.BACKEND_REGION }}
          variable: BACKEND_REGION

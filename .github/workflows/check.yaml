name: Check

permissions:
  contents: write
  id-token: write

on:
  workflow_call:
    secrets:
      INFRACOST_API_KEY:
        required: false
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

jobs:

  files:
    runs-on: ubuntu-latest
    steps:

      - name: init
        id: init
        uses: stormreply/slt-workflows/.github/actions/init@main
        with:
          github_vars: "${{ toJson(vars) }}"
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}

      - name: check files
        id: check-files
        uses: stormreply/slt-workflows/.github/actions/check/files@main
        with:
          exit_on_fail: true
          publish_badge: true

  code:
    runs-on: ubuntu-latest
    steps:

      - name: init
        id: init
        uses: stormreply/slt-workflows/.github/actions/init@main
        with:
          github_vars: "${{ toJson(vars) }}"
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}
          show_github_env: true

      - name: check code
        uses: stormreply/slt-workflows/.github/actions/check/code@main
        with:
          publish_badge: true

  compliance:
    runs-on: ubuntu-latest
    steps:

      - name: init
        id: init
        uses: stormreply/slt-workflows/.github/actions/init@main
        with:
          github_vars: "${{ toJson(vars) }}"
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}

      - name: check compliance
        uses: stormreply/slt-workflows/.github/actions/check/compliance@main
        with:
          exit_on_fail: true
          publish_badge: true

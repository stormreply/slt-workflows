name: Check

permissions:
  contents: write
  id-token: write

on:
  workflow_call:
    secrets:
      INFRACOST_API_KEY:
        required: false
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

jobs:

  compliance:
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          action: check
          github_vars: "${{ toJson(vars) }}"

      - name: check compliance
        uses: stormreply/slt-workflows/.github/actions/check/compliance@main
        with:
          exit_on_fail: false
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}
        continue-on-error: true

      - name: publish badge
        uses: stormreply/slt-workflows/.github/actions/badges@main
        with:
          label: label
          message: message
          score: 0

  code:
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          action: check
          github_vars: "${{ toJson(vars) }}"

      - name: check-code
        uses: stormreply/slt-workflows/.github/actions/check/code@main
        with:
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}

name: Apply

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      lifetime:
        type: string
        required: false
        default: 1 hour
      delay:
        type: string
        required: false
        default: ""
      environment:
        type: string
        required: false
        default: ""
      var_file:
        type: string
        required: false
        default: ""
    secrets:
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

jobs:

  schedule:
    if: inputs.delay != ''
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"
          yaml: |
            ENVIRONMENT: ${{ inputs.environment || github.actor }}
          show: apply

      - name: set backend profile in AWS config
        uses: stormreply/slt-workflows/.github/actions/terraform/checkout/set-backend-profile@main

      - name: schedule apply
        uses: stormreply/slt-workflows/.github/actions/schedule@main
        with:
          action: apply
          lifetime: ${{ inputs.lifetime }}
          delay: ${{ inputs.delay }}

  check:
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"
          yaml: |
            ENVIRONMENT: ${{ inputs.environment || github.actor }}
          show: apply

      - name: scan
        uses: stormreply/slt-workflows/.github/actions/scan@main

  plan:
    if: inputs.delay == ''
    runs-on: ubuntu-latest
    outputs:
      env_json: ${{ steps.set-environment.outputs.env_json }}
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"
          yaml: |
            ENVIRONMENT: ${{ inputs.environment || github.actor }}

      - name: plan
        uses: stormreply/slt-workflows/.github/actions/plan@main
        with:
          var_file: ${{ inputs.var_file }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.plan.outputs.env_json) }}
    steps:

      - name: apply
        id: apply
        uses: stormreply/slt-workflows/.github/actions/apply@main
        continue-on-error: true

      - name: unschedule apply
        id: unschedule-apply
        uses: stormreply/slt-workflows/.github/actions/unschedule@main
        with:
          action: apply
        continue-on-error: true

      - name: schedule destroy
        id: schedule-destroy
        uses: stormreply/slt-workflows/.github/actions/schedule@main
        with:
          action: destroy
          delay: ${{ inputs.lifetime }}
          environment: ${{ inputs.environment || github.actor }}
        continue-on-error: true

      - name: unlock terraform
        id: unlock-terraform
        if: steps.apply.outcome == 'failure'
        uses: stormreply/slt-workflows/.github/actions/unlock@main

      - name: check failure
        if: |
          steps.apply.outcome == 'failure' ||
          steps.unschedule-apply.outcome == 'failure' ||
          steps.schedule-destroy.outcome == 'failure'
        run: |
          # failed
          echo "at least one step failed — marking job as failed."
          exit 1

name: Apply

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      lifetime:
        type: string
        required: false
        default: 1 hour
      delay:
        type: string
        required: false
        default: ""
    secrets:
      INFRACOST_API_KEY:
        required: false
      STORM_LIBRARY_FOR_TERRAFORM:
        required: false
      TERRAFORM_PRIVATE_KEY:
        required: false

concurrency:
  group: ${{ github.repository }}-apply
  cancel-in-progress: false

jobs:

  schedule:
    if: inputs.delay != ''
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          action: apply
          github_vars: "${{ toJson(vars) }}"

      - name: set backend profile in AWS config
        uses: stormreply/slt-workflows/.github/actions/terraform/checkout/set-backend-profile@main

      - name: schedule apply
        uses: stormreply/slt-workflows/.github/actions/schedule@main
        with:
          action: apply
          lifetime: ${{ inputs.lifetime }}
          delay: ${{ inputs.delay }}

  check:
    runs-on: ubuntu-latest
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          action: apply
          github_vars: "${{ toJson(vars) }}"

      - name: check code
        uses: stormreply/slt-workflows/.github/actions/check/code@main
        with:
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}

  plan:
    if: inputs.delay == ''
    runs-on: ubuntu-latest
    outputs:
      env_json: ${{ steps.set-environment.outputs.env_json }}
    steps:

      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"

      - name: plan
        uses: stormreply/slt-workflows/.github/actions/plan@main
        with:
          infracost_api_key: ${{ secrets.INFRACOST_API_KEY }}
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.plan.outputs.env_json) }}
    steps:

      - name: apply
        id: apply
        uses: stormreply/slt-workflows/.github/actions/apply@main
        with:
          personal_access_token: ${{ secrets.STORM_LIBRARY_FOR_TERRAFORM }}
          terraform_app_id: ${{ vars.TERRAFORM_APP_ID }}
          terraform_private_key: ${{ secrets.TERRAFORM_PRIVATE_KEY }}
        continue-on-error: true

      - name: unschedule apply
        id: unschedule-apply
        uses: stormreply/slt-workflows/.github/actions/unschedule@main
        with:
          action: apply
        continue-on-error: true

      - name: schedule destroy
        id: schedule-destroy
        uses: stormreply/slt-workflows/.github/actions/schedule@main
        with:
          action: destroy
          delay: ${{ inputs.lifetime }}
        continue-on-error: true

      - name: unlock terraform
        id: unlock-terraform
        if: always()
        uses: stormreply/slt-workflows/.github/actions/unlock@main

      - name: check failure
        if: |
          steps.apply.outcome == 'failure' ||
          steps.unschedule-apply.outcome == 'failure' ||
          steps.schedule-destroy.outcome == 'failure'
        run: |
          # failed
          echo "at least one step failed — marking job as failed."
          exit 1

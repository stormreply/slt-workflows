name: Configure v2

on:
  workflow_call:
    # checkov:skip=CKV_GHA_7: "GitHub Actions workflow_dispatch inputs MUST be empty"
    inputs:
      account_id:
        description: "AWS Account Id"
        type: string
      configuration_target:
        description: "Configuration Target"
        type: string
      region:
        description: "AWS Region"
        type: string
      role:
        description: "AWS role"
        type: string
    secrets:
      aws_access_key_id:
        required: true
        description: "AWS Access Key ID for bootstrap authentication"
      aws_secret_access_key:
        required: true
        description: "AWS Secret Access Key for bootstrap authentication"


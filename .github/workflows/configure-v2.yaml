name: Configure v2

on:
  workflow_call:
    # checkov:skip=CKV_GHA_7: "GitHub Actions workflow_dispatch inputs MUST be empty"
    inputs:
      access_domain:
        type: string
      permission_set:
        type: string
      account_id:
        type: string
      region:
        type: string
      sso:
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:

  init:
    runs-on: ubuntu-latest
    outputs:
      env_json: ${{ steps.set-environment.outputs.env_json }}
    steps:
      - name: set environment
        id: set-environment
        uses: stormreply/slt-workflows/.github/actions/set-environment@main
        with:
          github_vars: "${{ toJson(vars) }}"
          github_inputs: |
            ACCESS_DOMAIN: ${{ inputs.access_domain }}
            ACCESS_ROLE: ${{ inputs.permission_set }}
            BACKEND_ACCOUNT: ${{ inputs.account_id }}
            BACKEND_REGION: ${{ inputs.region }}
            DEPLOYMENT_ACCOUNT: ${{ inputs.account_id }}
            DEPLOYMENT_REGION: ${{ inputs.region }}
            OIDC_PRINCIPAL: ${{ github.repository_owner }}
          action: configure

  sso:
    needs: init
    if: inputs.sso == 'true'
    runs-on: ubuntu-latest
    outputs:
      ACCESS_TOKEN: ${{ steps.get-access-token.outputs.ACCESS_TOKEN }}
    env: ${{ fromJson(needs.init.outputs.env_json) }}
    steps:
      - name: get access token
        id: get-access-token
        uses: stormreply/slt-workflows/.github/actions/configure/sso/get-access-token@main
        with:
          access_domain: ${{ inputs.access_domain }}
          region: ${{ inputs.region }}

  build:
    needs: [init, sso]
    if: always()
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.init.outputs.env_json) }}
    steps:

      - name: get-creds-from-identity-center
        if: inputs.sso == 'true'
        id: get-creds-from-identity-center
        uses: stormreply/slt-workflows/.github/actions/configure/sso/get-credentials@main
        with:
          access_token: ${{ needs.sso.outputs.ACCESS_TOKEN }}
          account_id: ${{ inputs.account_id }}
          permission_set: ${{ inputs.permission_set }}
          region: ${{ inputs.region }}

      - name: get-creds-from-github-secrets
        if: inputs.sso != 'true'
        id: get-creds-from-github-secrets
        shell: bash
        run: |
          # configure-v2/get-credentials
          cat << EOF >> $GITHUB_ENV
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION=${{ inputs.region }}
          EOF

      - name: Verify AWS Identity
        shell: bash
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity

      - name: create backend bucket
        uses: stormreply/slt-workflows/.github/actions/configure/build/create-backend-bucket@main

      - name: create github oidc provider
        uses: stormreply/slt-workflows/.github/actions/configure/build/create-github-oidc-provider@main

      - name: checkout code
        uses: stormreply/slt-workflows/.github/actions/terraform/checkout@main
        with:
          init: true

      # - name: Terraform plan
      #   uses: stormreply/slt-workflows/.github/actions/terraform/plan@main

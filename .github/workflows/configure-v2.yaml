name: Configure v2

on:
  workflow_call:
    # checkov:skip=CKV_GHA_7: "GitHub Actions workflow_dispatch inputs MUST be empty"
    inputs:
      access_domain:
        type: string
      permission_set:
        type: string
      account_id:
        type: string
      region:
        type: string
      sso:
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:

  sso:
    if: inputs.sso == 'true'
    runs-on: ubuntu-latest
    outputs:
      ACCESS_TOKEN: ${{ steps.get-access-token.outputs.ACCESS_TOKEN }}
    steps:
      - name: get access token
        id: get-access-token
        uses: stormreply/slt-workflows/.github/actions/configure/sso/get-access-token@main
        with:
          access_domain: ${{ inputs.access_domain }}
          region: ${{ inputs.region }}

  build:
    needs: sso
    if: always()
    runs-on: ubuntu-latest
    steps:

      - name: get-creds-from-identity-center
        if: inputs.sso == 'true'
        id: get-creds-from-identity-center
        uses: stormreply/slt-workflows/.github/actions/configure/sso/get-credentials@main
        with:
          access_token: ${{ needs.sso.outputs.ACCESS_TOKEN }}
          account_id: ${{ inputs.account_id }}
          permission_set: ${{ inputs.permission_set }}
          region: ${{ inputs.region }}

      - name: get-creds-from-github-secrets
        id: get-creds-from-github-secrets
        shell: bash
        run: |
          # configure-v2/get-credentials

          cat << EOF >> $GITHUB_ENV
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION=${{ inputs.region }}
          EOF

      - name: Verify AWS Identity
        shell: bash
        run: |
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity

